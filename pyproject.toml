[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "faceless-video-machine"
version = "0.1.0"
description = "A free, dependency-light toolkit for planning faceless YouTube videos"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "faceless-video-machine contributors"}]
dependencies = []

[project.scripts]
fvm = "faceless_video_machine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
